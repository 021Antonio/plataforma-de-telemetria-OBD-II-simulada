; esp32dev: firmware (pio run -e esp32dev -t upload). native: compila no PC o servidor de testes.
; Os testes oficiais rodam por `make -C firmware test`, sem PlatformIO.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Iinclude -Ilib/elm327
build_unflags = -std=gnu++11
build_src_filter = +<*>

[env:native]
platform = native
build_flags = -std=c++17 -Iinclude -Ilib/elm327 -pthread
build_src_filter = -<*> +<../tools/host_server.cpp>
lib_deps =
test_ignore = *
