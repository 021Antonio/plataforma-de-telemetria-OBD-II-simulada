# Configuração padrão. Valores de transporte, PIDs, taxas e portas.

portas:
  servidor: 8000      # FastAPI: REST, WebSocket e dashboard
  painel: 8001        # rotas do painel de controle do simulador
  elm327_tcp: 35000   # servidor TCP compatível com ELM327

can:
  transporte: virtual # virtual | socketcan | slcan | elm327_tcp
  taxa_bps: 500000    # taxa CAN padrão do OBD-II (ISO 15765-4)

coleta:
  intervalo_ms: 100   # período base do laço de aquisição

# PIDs do modo 01 monitorados por padrão (código hexadecimal).
pids:
  - 0x04   # carga do motor
  - 0x05   # temperatura do líquido de arrefecimento
  - 0x0B   # pressão do coletor de admissão
  - 0x0C   # rotação do motor (RPM)
  - 0x0D   # velocidade do veículo
  - 0x0F   # temperatura do ar de admissão
  - 0x11   # posição do acelerador
  - 0x2F   # nível de combustível

# Modelo de veículo simulado (compacto 1.6 aspirado; valores ilustrativos).
veiculo:
  raio_pneu_m: 0.30
  relacao_final: 4.06
  relacoes_marcha: [3.62, 2.19, 1.41, 1.03, 0.81]
  marcha_lenta_rpm: 800
  tau_arrefecimento_s: 120
  temperatura_ambiente_c: 25

# Canal entre coletor e servidor. O HTTP é o padrão; mqtt exige o Mosquitto (docker compose --profile mqtt).
publisher: http       # http | mqtt
servidor_url: http://localhost:8000
mqtt:
  host: localhost
  porta: 1883
  veiculo: simulado   # tópicos telemetria/<veiculo>/dados e telemetria/<veiculo>/dtc

# Coletor (equivalente lógico do firmware do ESP32).
coletor:
  transporte: loopback  # can_virtual | loopback | elm327_tcp
  intervalo_ms: 100     # período alvo do ciclo de leitura
  timeout_ms: 100       # espera por resposta de cada PID
  dtc_intervalo_s: 2.0  # período de leitura do PID 0x01 (e do Modo 03 se mudar)
  recuo:                # recuo progressivo após falhas seguidas
    limiar: 3           # falhas seguidas que ativam o recuo
    base_ms: 50         # primeira espera; dobra a cada nova falha
    max_ms: 2000
  # Plano de leitura por PID: a_cada = ciclos entre leituras; prioridade menor vai primeiro.
  plano:
    0x0C: {a_cada: 1, prioridade: 0}   # rotação (rápido)
    0x0B: {a_cada: 1, prioridade: 1}   # MAP (rápido)
    0x11: {a_cada: 1, prioridade: 2}   # borboleta (rápido)
    0x0D: {a_cada: 1, prioridade: 3}   # velocidade (rápido)
    0x04: {a_cada: 5, prioridade: 4}   # carga
    0x05: {a_cada: 5, prioridade: 5}   # líquido de arrefecimento (lento)
    0x0F: {a_cada: 5, prioridade: 6}   # ar de admissão (lento)
    0x2F: {a_cada: 5, prioridade: 7}   # combustível (lento)
    0x42: {a_cada: 5, prioridade: 8}   # tensão (lento)
