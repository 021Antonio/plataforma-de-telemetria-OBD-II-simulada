# Serviços de apoio. O Mosquitto só sobe com o perfil mqtt:
#   docker compose --profile mqtt up -d mosquitto
services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
      - "35000:35000"
    environment:
      OBD_ELM327_LOG: "${OBD_ELM327_LOG:-0}"  # 1 imprime cada comando AT/OBD recebido
    volumes:
      - obd-data:/app/data
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  obd-data:
