<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetria OBD-II</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Telemetria OBD-II <small>simulada</small></h1>
  <span class="metrica">Taxa <b><span id="rate">–</span> Hz</b></span>
  <span class="metrica">Ciclo <b><span id="cycle">–</span> ms</b></span>
  <span class="metrica">Latência <b><span id="latency">–</span> ms</b></span>
  <span id="conn-state" class="pill reconnecting">reconectando</span>
</header>
<div id="overlay" class="overlay" hidden>Sem dados: valores ocultos</div>
<main id="panels">
  <section class="card rpm">
    <h2>Rotação</h2>
    <svg id="rpm-gauge" class="gauge" viewBox="-100 -100 200 186" role="img" aria-label="Conta-giros">
      <defs><linearGradient id="grad-azul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fb4f2"/><stop offset="1" stop-color="#1d5fd1"/></linearGradient></defs>
      <path class="gtrack" d="M-78 45 A90 90 0 1 1 78 45" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M-78 45 A90 90 0 1 1 78 45" fill="none" stroke="url(#grad-azul)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <path id="rpm-redline" fill="none" stroke="#c62828" stroke-width="7"/>
      <g id="rpm-ticks"></g>
      <line id="rpm-needle" class="needle" x1="0" y1="8" x2="0" y2="-74" stroke="#1b2333" stroke-width="1.6" stroke-linecap="round"/>
      <circle r="5" fill="#1b2333"/><circle r="2" fill="#fff"/>
      <text id="rpm-text" y="64" text-anchor="middle" class="gtext">–</text>
      <text y="78" text-anchor="middle" class="gunit">rpm</text>
    </svg>
  </section>
  <section class="card vel hero">
    <div class="medida"><h2>Velocidade</h2><div><span id="speed" class="big">–</span><span class="unidade">km/h</span></div></div>
  </section>
  <section class="card map">
    <h2>Coletor de admissão</h2>
    <svg id="map-gauge" class="gauge" viewBox="-100 -100 200 186" role="img" aria-label="Manômetro do coletor">
      <path class="gtrack" d="M-78 45 A90 90 0 1 1 78 45" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M-78 45 A90 90 0 1 1 78 45" fill="none" stroke="url(#grad-azul)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <g id="map-ticks"></g>
      <line id="map-needle" class="needle" x1="0" y1="8" x2="0" y2="-74" stroke="#1b2333" stroke-width="1.6" stroke-linecap="round"/>
      <circle r="5" fill="#1b2333"/><circle r="2" fill="#fff"/>
      <text id="map-text" y="64" text-anchor="middle" class="gtext">–</text>
      <text y="78" text-anchor="middle" class="gunit">bar</text>
    </svg>
  </section>
  <section class="card sec secundario">
    <div class="sec-grupo digits">
      <div class="medida"><h2>Temperatura</h2><span id="coolant" class="big">–</span><span class="unidade">°C</span></div>
      <div class="medida"><h2>Combustível</h2><span id="fuel" class="big">–</span><span class="unidade">%</span></div>
    </div>
    <div class="bars sec-bloco">
      <label>Tensão <span id="val-voltage">–</span><div class="bar"><i id="bar-voltage"></i></div></label>
      <label>Carga <span id="val-load">–</span><div class="bar"><i id="bar-load"></i></div></label>
    </div>
    <div class="bars sec-bloco">
      <label>Borboleta <span id="val-throttle">–</span><div class="bar"><i id="bar-throttle"></i></div></label>
      <label>Ajuste de mistura <span id="val-trim">–</span><div class="bar centered"><i id="bar-trim"></i></div></label>
    </div>
  </section>
  <section class="card wide">
    <h2>Últimos 60 s</h2>
    <div id="chart-tabs" class="abas" role="tablist" aria-label="Variável do gráfico">
      <button class="aba" role="tab" aria-selected="true" data-series="rpm">Rotação</button>
      <button class="aba" role="tab" aria-selected="false" data-series="speed">Velocidade</button>
      <button class="aba" role="tab" aria-selected="false" data-series="coolant">Temperatura</button>
      <button class="aba" role="tab" aria-selected="false" data-series="throttle">Borboleta</button>
      <button class="aba" role="tab" aria-selected="false" data-series="map">Coletor</button>
      <button class="aba" role="tab" aria-selected="false" data-series="load">Carga</button>
    </div>
    <div class="grafico">
      <div class="eixo-y"><span id="chart-max">–</span><span id="chart-min">–</span></div>
      <svg id="chart" viewBox="0 0 600 150" preserveAspectRatio="none" role="img" aria-label="Série dos últimos 60 segundos">
        <defs><linearGradient id="grad-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d5fd1" stop-opacity=".22"/><stop offset="1" stop-color="#1d5fd1" stop-opacity=".02"/></linearGradient></defs>
        <line class="grade" x1="0" y1="10" x2="600" y2="10"/><line class="grade" x1="0" y1="75" x2="600" y2="75"/><line class="grade" x1="0" y1="140" x2="600" y2="140"/>
        <polygon id="chart-area" fill="url(#grad-area)" points=""/>
        <polyline id="chart-line" fill="none" stroke="#1d5fd1" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      </svg>
      <div class="eixo-x"><span>-60 s</span><span>-45 s</span><span>-30 s</span><span>-15 s</span><span>agora</span></div>
    </div>
  </section>
  <section class="card diag">
    <h2>Diagnóstico <span id="mil" class="mil off">MIL</span></h2>
    <ul id="dtc-list"><li class="muted">Nenhum DTC</li></ul>
    <p id="dtc-desc" class="muted"></p>
  </section>
  <section class="card evt">
    <h2>Eventos</h2>
    <ul id="events"></ul>
  </section>
</main>
<script src="gauges.js"></script>
<script src="app.js"></script>
</body>
</html>
